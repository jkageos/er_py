# Task 05: Ackley Problem Optimization

# Search space bounds
ackley:
  x_min: -32.768
  x_max: 32.768
  y_min: -32.768
  y_max: 32.768
  z_min: -32.768
  z_max: 32.768

# Evolutionary algorithm parameters
ea:
  population_size: 100
  generations: 500
  mutation_rate: 0.1
  elitism: true
  tournament_size: 2
  gaussian_std: 2.0

# Mutation rate sweep parameters
parameter_sweep:
  mutation_rates: [0.02, 0.05, 0.1, 0.2, 0.4]
  n_runs_per_setting: 5

# Task 09: Ring Problem parameters
ring:
  cells_per_half: 20

  # Evolutionary algorithm parameters
  ea:
    population_size: 80
    max_generations: 200
    target_fitness: 0.99
    mutation_rate: 0.1
    mutation_std: 0.7
    elite_size: 2

  # Fitness evaluation parameters
  fitness:
    num_trials: 20
    steps_per_trial: 300
    threshold: 0.5

  # Output parameters
  output:
    print_every: 10
    test_start_positions: [0, 10, 20, 30]
    trajectory_steps: 200

# Parallel processing parameters
parallel:
  enabled: true
  n_workers: null # null for auto-detect

# Output and logging
output:
  print_every: 5
  plots_dir: "plots"
  dpi: 150

# Task 11: Maze Exploration with Novelty Search
task11:
  # Environment parameters
  environment:
    width: 1200
    height: 1000
    robot_radius: 10.0
    max_sensor_range: 200.0 # INCREASED: was 100, now 200 for better lookahead
    eval_steps: auto
    max_speed: auto
    maze_cols: 12
    maze_rows: 10
    wall_thickness: 8.0
    seed: 42
    physics:
      mass: 1.0
      friction: 0.5
      elasticity: 0.1
      damping: 0.95
      iterations: 10
    lidar:
      num_rays: 5 # INCREASED: was 3, now 5 for better spatial awareness

  # Evolutionary algorithm parameters
  evolution:
    population_size: 150
    n_generations: 50
    n_hidden: 8
    n_hidden_layers: 2
    mutation_rate: 0.4
    mutation_sigma: 0.8
    tournament_size: 3
    elitism: 3
    iso_sigma: 0.02
    line_sigma: 0.2
    use_cmaes: true
    num_emitters: 5
    emitter_batch_size: 30
    restart_threshold: 0.01

  # Novelty search parameters
  novelty:
    archive_threshold: 0.02
    k_nearest: 15
    target_add_rate: 0.2
    adapt_rate: 0.05
    min_threshold: 0.005
    max_threshold: 0.1
    archive_max_size: 10000
    use_extended_behavior: true

  # Rendering
  rendering:
    enabled: false
    render_every: 1

  # Output parameters
  output:
    plots_dir: "plots"
    results_dir: "results"
    print_every: 1

# Global settings
global:
  dpi: 150
