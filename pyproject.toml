[project]
name = "er"
version = "0.1.0"
description = "Evolutionary robotics assignments"
requires-python = ">=3.13"
dependencies = ["pygame", "pyyaml", "numpy", "matplotlib"]

[dependency-groups]
dev = ["ruff"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["task*", "utils"]
namespaces = false
